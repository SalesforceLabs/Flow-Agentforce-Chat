<template>
    <lightning-card title="" icon-name="">
        <div class="chat-container">
            <!-- Chat history -->
            <div class="chat-history">
                <template for:each={messages} for:item="message">
                    <div key={message.id} class={message.containerClass}>
                        <div class="chat-bubble-wrapper">
                            <template lwc:if={message.isAgent}>
                                <div class="agent-avatar">
                                    <lightning-icon icon-name="utility:agent_astro" size="x-small" alternative-text="Agent"></lightning-icon>
                                </div>
                            </template>
                            <div class={message.bubbleClass}>
                                <template lwc:if={message.isTyping}>
                                    <div class="typing-dots">
                                        <span></span>
                                        <span></span>
                                        <span></span>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div class="chat-message-content">
                                        <div class="chat-message-text">
                                            {message.text}
                                        </div>
                                        <lightning-button-icon
                                            icon-name="utility:copy"
                                            size="x-small"
                                            alternative-text="Copy message"
                                            title="Copy message"
                                            onclick={handleCopyMessage}
                                            data-message={message.text}
                                            class="copy-button">
                                        </lightning-button-icon>
                                    </div>
                                    <div class="chat-timestamp">
                                        {message.timestamp}
                                    </div>
                                </template>
                            </div>
                            <template lwc:if={message.isUser}>
                                <div class="user-avatar">
                                    <lightning-icon icon-name="utility:user" size="x-small" alternative-text="You"></lightning-icon>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
                <template lwc:if={noMessages}>
                    <lightning-formatted-rich-text value={placeholderText}></lightning-formatted-rich-text>
                </template>
            </div>

            <!-- User input -->
            <div class="chat-input-container">
                <div class="input-wrapper">
                    <lightning-input
                        type="text"
                        name="userInput"
                        value={userMessage}
                        onchange={handleInputChange}
                        onkeyup={handleKeyUp}
                        placeholder={labelText}
                        disabled={isLoading}
                        class="chat-input"
                    ></lightning-input>
                    <lightning-button
                        icon-name="utility:send"
                        variant="brand"
                        onclick={handleSendMessage}
                        disabled={isLoading}
                        alternative-text="Send message"
                    ></lightning-button>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
